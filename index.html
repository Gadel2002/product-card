<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>product card</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div>
        <div class="dandel__img">
          <img src="./images/bg-dandelions.png" alt="Одуванчики" />
        </div>
        <h1 class="container__title" id="main-title">Выбери свой продукт</h1>
      </div>
      <button class="button__card" id="recolor-first-card-button">
        Перекрась фон первой карточки
      </button>
      <button class="button__card" id="recolor-all-card-button">
        Перекрась фон всех карточек
      </button>
      <button class="button__card" id="open-google-page-button">
        Открыть страницу Google
      </button>
      <button class="click__button" id="change-my-color">
        Поменяй мой цвет
      </button>
      <button class="button__card" id="button-registration">Регистрация</button>
      <div class="product-card__wrapper" id="product-card__list"></div>
      <template id="product-card__template">
        <div class="product-card__card">
          <img class="card__img" src="" alt="" />
          <p class="card__for-skin"></p>
          <h3 class="card__use"></h3>
          <p class="card__description"></p>
          <span class="card__compound">Состав:</span>
          <ul class="card__ingredients"></ul>
          <div class="card__price">
            <span class="price__title">Цена</span>
            <span class="price"></span>
          </div>
        </div> </template
      >`
    </div>
    <div class="modal" id="modal">
      <div class="modal__overlay"></div>
      <div class="modal__content">
        <button class="close__modal" type="button" id="close-modal">
          &times;
        </button>
        <form
          action=""
          class="modal__form"
          id="form-registration"
          name="registration"
        >
          <label for="name">Имя:</label>
          <input
            type="text"
            name="name"
            id="name"
            placeholder="Ваше имя..."
            required
          />
          <label for="surname">Фамилия:</label>
          <input
            type="text"
            name="surname"
            id="surname"
            placeholder="Ваша фамилия..."
            required
          />
          <label for="birthData">Дата рождения:</label>
          <input
            type="date"
            name="birthData"
            id="birthData"
            placeholder="Ваша дата рождения..."
            required
          />
          <label for="login">Логин:</label>
          <input
            type="text"
            name="login"
            id="login"
            placeholder="Ваш логин..."
            required
          />
          <label for="password">Пароль:</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Введите пароль..."
            required
            minlength="8"
          />
          <label for="password-confirm">Повторите пароль:</label>
          <input
            type="password"
            name="passwordConfirm"
            id="password-confirm"
            placeholder="Повторите пароль..."
            required
            minlength="8"
          />
          <button class="button__registration" type="submit">
            Зарегистрироваться
          </button>
        </form>
      </div>
    </div>
    <footer class="footer">
      <div class="footer__container">
        <div class="footer__content-one">
          <p class="footer__logo">Product Cards</p>
          <p class="footer__text">У нас самые лучшие продукты для кожи!</p>
          <div class="footer__socials">
            <a href="#">
              <img
                class="footer__icon-link"
                src="./images/icon-telegram.svg"
                alt="Telegram"
              />
            </a>
            <a href="#">
              <img
                class="footer__icon-link"
                src="./images/icon-Vk.svg"
                alt="VK"
              />
            </a>
          </div>
        </div>
        <div class="footer__content-two">
          <p class="footer__subscribe">Подпишись на наши акции:</p>
          <form action="" id="email-form" class="footer__form" name="email">
            <input
              type="email"
              name="email"
              placeholder="Введи Email..."
              class="footer__input"
              required
            />
            <img
              src="./images/line-input.png"
              alt="Черточка"
              class="form__img"
            />
            <button type="submit" class="footer__btn">Подписаться</button>
          </form>
        </div>
        <nav class="footer__content-three">
          <a class="footer__links">Быстрые ссылки</a>
          <ul class="footer__list">
            <li><a class="footer__link" href="#">Главная</a></li>
            <li><a class="footer__link" href="#">Магазин</a></li>
            <li><a class="footer__link" href="#">Контакты</a></li>
          </ul>
        </nav>
      </div>
      <div class="footer__bottom">
        <img src="./images/line-bottom.png" class="footer__line" />
      </div>
      <a href="#" class="footer__site-link"
        >www.product-cards.com©all rights reserved.</a
      >
    </footer>
    <script src="./homework-5.js"></script>
    <script src="./homework-6.js"></script>
    <script type="module" src="./homework-7.js"></script>
    <script type="module" src="./homework-8.js"></script>
    <script src="./homework-9.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
