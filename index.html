<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>product card</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div>
        <div class="dandel__img">
          <img src="./images/bg-dandelions.png" alt="Одуванчики" />
        </div>
        <h1 class="container__title" id="main-title">Выбери свой продукт</h1>
      </div>
      <button class="button__card" id="recolor-first-card-button">
        Перекрась фон первой карточки
      </button>
      <button class="button__card" id="recolor-all-card-button">
        Перекрась фон всех карточек
      </button>
      <button class="button__card" id="open-google-page-button">
        Открыть страницу Google
      </button>
      <button class="click__button" id="change-my-color">
        Поменяй мой цвет
      </button>
      <div class="product-card__wrapper" id="product-card__list"></div>
      <template id="product-card__template">
        <div class="product-card__card">
          <img class="card__img" src="" alt="" />
          <p class="card__for-skin"></p>
          <h3 class="card__use"></h3>
          <p class="card__description"></p>
          <span class="card__compound">Состав:</span>
          <ul class="card__ingredients"></ul>
          <div class="card__price">
            <span class="price__title">Цена</span>
            <span class="price"></span>
          </div>
        </div>
      </template>
    </div>
    <script src="./homework-5.js"></script>
    <script src="./homework-6.js"></script>
    <script type="module" src="./homework-7.js"></script>
    <script type="module" src="./homework-8.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
